name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Instalar Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip
          echo "$PWD/gradle-8.13/bin" >> $GITHUB_PATH

      - name: Descompactar projeto
        run: |
          unzip -q ProcuraServico_Facil_Celular.zip
          ls -la

      - name: Compilar
        run: |
          cd ProcuraServico_Facil_Celular
          gradle assembleDebug --no-daemon

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Procura-Servico-APK
          path: ProcuraServico_Facil_Celular/app/build/outputs/apk/debug/*.apk
